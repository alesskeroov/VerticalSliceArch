name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build backend/src/TodoApi/TodoApi.csproj --configuration Release
      - run: dotnet test backend/tests/TodoApi.Tests/TodoApi.Tests.csproj --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
